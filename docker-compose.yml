version: '3.1'
services:
  postgres-bookmarks:
    image: postgres:17.5
    container_name: 'postgres-bookmarks'
    restart: always
    environment:
      POSTGRES_PASSWORD: 'postgres' # this should be changed
    volumes:
      - ./postgres-bookmarks-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
